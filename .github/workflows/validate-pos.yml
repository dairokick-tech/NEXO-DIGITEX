name: Validate local POS
on:
  pull_request:
  push:
    branches: [nova-digitex-build]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("pos.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit("No inline script found in pos.html")
          Path("/tmp/pos-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/pos-inline.js
